name: Build and Upload iOS
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Download exported Xcode project
        run: |
          curl -L -o build.zip https://github.com/PabloJapon/IphoneBuilds/releases/download/v1/Apple.zip
          unzip -q build.zip -d extracted

      - name: Build certificate from raw key and cer (no third-party sites)
        env:
          CERT_KEY: ${{ secrets.CERT_KEY }}
          CERT_CER_BASE64: ${{ secrets.CERT_CER_BASE64 }}
        run: |
          echo "$CERT_KEY" > cert.key
          echo "$CERT_CER_BASE64" | base64 --decode > cert.cer
          openssl x509 -inform DER -in cert.cer -out cert.pem
          openssl pkcs12 -export -inkey cert.key -in cert.pem -out cert.p12 -passout pass:GastraliBuild2026
          echo "p12 creado correctamente:"
          ls -la cert.p12

      - name: Import certificate into keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p temp1234 "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p temp1234 "$KEYCHAIN_PATH"
          security import cert.p12 -P GastraliBuild2026 -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive
        run: |
          PROJECT_PATH=$(find extracted -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          xcodebuild -project "$(basename "$PROJECT_PATH")" -scheme Unity-iPhone \
            -configuration Release -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=MB3DD5P92N \
            PROVISIONING_PROFILE_SPECIFIER=Gastrali_AppStore \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export IPA
        run: |
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>MB3DD5P92N</string>
            <key>provisioningProfiles</key>
            <dict><key>com.Gastrali.Gastrali</key><string>Gastrali_AppStore</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath App.xcarchive -exportPath export \
            -exportOptionsPlist exportOptions.plist

      - name: Upload to App Store
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
