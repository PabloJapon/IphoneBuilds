name: Build and Upload iOS
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Download exported Xcode project
        run: |
          curl -L -o build.zip https://github.com/PabloJapon/IphoneBuilds/releases/download/v1/Apple.zip
          unzip -q build.zip -d extracted
          find extracted -maxdepth 3

      - name: Write API key and check secrets
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          echo "Longitud KEY_ID: ${#KEY_ID}"
          echo "Longitud ISSUER_ID: ${#ISSUER_ID}"
          echo "Longitud KEY_P8: ${#KEY_P8}"
          mkdir -p ~/private_keys
          echo "$KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8
          echo "$KEY_ID" > /tmp/key_id.txt
          echo "$ISSUER_ID" > /tmp/issuer_id.txt

      - name: Archive with automatic signing
        run: |
          KEY_ID=$(cat /tmp/key_id.txt)
          ISSUER_ID=$(cat /tmp/issuer_id.txt)
          PROJECT_PATH=$(find extracted -name "*.xcodeproj" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          cd "$PROJECT_DIR"
          xcodebuild -project "$(basename "$PROJECT_PATH")" -scheme Unity-iPhone \
            -configuration Release -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            DEVELOPMENT_TEAM=MB3DD5P92N \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            archive

      - name: Export IPA
        run: |
          KEY_ID=$(cat /tmp/key_id.txt)
          ISSUER_ID=$(cat /tmp/issuer_id.txt)
          cat > exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>MB3DD5P92N</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath App.xcarchive -exportPath export \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to App Store
        run: |
          KEY_ID=$(cat /tmp/key_id.txt)
          ISSUER_ID=$(cat /tmp/issuer_id.txt)
          xcrun altool --upload-app -f export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
