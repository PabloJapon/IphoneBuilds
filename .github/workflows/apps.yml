# One workflow for the three iOS apps (A6d, 2026-11-19). build.yml stays as the old Gastrali fallback.
# Input: an Xcode project exported on Windows by Unity (GastraliBuild.TpvIos / CocinaIos / GastraliIos,
# menu Gastrali > Build mobile) = <App>-ios.zip attached to the release "apps" of this repo.
# Same Apple Distribution certificate + App Store Connect API key for every app; one provisioning profile per bundle ID.
# Secrets (names only): CERT_KEY, CERT_CER_BASE64, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64,
#   PROFILE_BASE64 (Gastrali, com.Gastrali.Gastrali), PROFILE_TPV_BASE64 (com.gastrali.tpv), PROFILE_COCINA_BASE64 (com.gastrali.cocina).
# Verify at first CI run: profile name read from the profile, chmod of the Unity scripts, icon without alpha, altool upload.
name: Build and Upload iOS app
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build'
        type: choice
        options: [tpv, cocina, gastrali]
        default: tpv
      release_tag:
        description: 'Release of this repo that holds <App>-ios.zip'
        default: apps

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      TEAM_ID: MB3DD5P92N
    steps:
      - name: Pick app
        run: |
          case "${{ inputs.app }}" in
            tpv)      echo "ZIP=TPV-ios.zip"      >> $GITHUB_ENV; echo "BUNDLE=com.gastrali.tpv"      >> $GITHUB_ENV ;;
            cocina)   echo "ZIP=Cocina-ios.zip"   >> $GITHUB_ENV; echo "BUNDLE=com.gastrali.cocina"   >> $GITHUB_ENV ;;
            gastrali) echo "ZIP=Gastrali-ios.zip" >> $GITHUB_ENV; echo "BUNDLE=com.Gastrali.Gastrali" >> $GITHUB_ENV ;;
          esac

      - name: Download exported Xcode project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" -R "$GITHUB_REPOSITORY" -p "$ZIP" -O build.zip
          unzip -q build.zip -d extracted
          # Zips made on Windows lose the executable bit of Unity's build-phase scripts.
          find extracted -name "*.sh" -exec chmod +x {} +

      - name: Build certificate from raw key and cer
        env:
          CERT_KEY: ${{ secrets.CERT_KEY }}
          CERT_CER_BASE64: ${{ secrets.CERT_CER_BASE64 }}
        run: |
          P12_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$P12_PASS"
          echo "P12_PASS=$P12_PASS" >> $GITHUB_ENV
          echo "$CERT_KEY" > cert.key
          echo "$CERT_CER_BASE64" | base64 --decode > cert.cer
          openssl x509 -inform DER -in cert.cer -out cert.pem
          openssl pkcs12 -export -inkey cert.key -in cert.pem -out cert.p12 -passout pass:"$P12_PASS"
          rm cert.key

      - name: Import certificate into keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security import cert.p12 -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile of this app
        env:
          P_TPV: ${{ secrets.PROFILE_TPV_BASE64 }}
          P_COCINA: ${{ secrets.PROFILE_COCINA_BASE64 }}
          P_GASTRALI: ${{ secrets.PROFILE_BASE64 }}
        run: |
          case "${{ inputs.app }}" in
            tpv) P="$P_TPV" ;; cocina) P="$P_COCINA" ;; gastrali) P="$P_GASTRALI" ;;
          esac
          if [ -z "$P" ]; then echo "Missing provisioning profile secret for ${{ inputs.app }}"; exit 1; fi
          echo "$P" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist)
          echo "Profile '$NAME' for $APPID"
          case "$APPID" in *".$BUNDLE") ;; *) echo "Profile is not for $BUNDLE"; exit 1 ;; esac
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_NAME=$NAME" >> $GITHUB_ENV
          echo "PROFILE_PATH=$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision" >> $GITHUB_ENV

      - name: Archive
        run: |
          PROJECT_PATH=$(find extracted -name "*.xcodeproj" | head -n 1)
          cd "$(dirname "$PROJECT_PATH")"
          # HTTPS only = exempt encryption, skips the export-compliance question per build:
          # https://developer.apple.com/documentation/bundleresources/information-property-list/itsappusesnonexemptencryption
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist || true
          ID=$(xcodebuild -project "$(basename "$PROJECT_PATH")" -target Unity-iPhone -showBuildSettings | awk '/ PRODUCT_BUNDLE_IDENTIFIER =/ {print $3; exit}')
          echo "Xcode bundle id: $ID"
          if [ "$ID" != "$BUNDLE" ]; then echo "Zip is not the ${{ inputs.app }} app ($ID != $BUNDLE)"; exit 1; fi

          fastlane run update_code_signing_settings \
            path:"$(basename "$PROJECT_PATH")" \
            use_automatic_signing:false \
            team_id:"$TEAM_ID" \
            code_sign_identity:"Apple Distribution" \
            targets:"Unity-iPhone"

          fastlane run update_project_provisioning \
            xcodeproj:"$(basename "$PROJECT_PATH")" \
            profile:"$PROFILE_PATH" \
            target_filter:"^Unity-iPhone$" \
            build_configuration:"Release" \
            code_signing_identity:"Apple Distribution"

          xcodebuild -project "$(basename "$PROJECT_PATH")" -scheme Unity-iPhone \
            -configuration Release -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            archive

      - name: Export IPA
        run: |
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath App.xcarchive -exportPath export \
            -exportOptionsPlist exportOptions.plist

      - name: Upload to App Store Connect (TestFlight)
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
